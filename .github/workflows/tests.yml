name: Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6

    - name: Install uv
      uses: astral-sh/setup-uv@v1
      with:
        version: "latest"

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.13"

    - name: Install dependencies
      run: UV_GIT_LFS=1 uv sync --dev

    - name: Run baseline regression checks
    if: github.ref_name == 'main'
    env:
      PROMPT_VERSION: baseline
    run: uv run pytest tests/test_behavior_evals.py -k "test_pass_" -v

  - name: Run improved evaluation suite
    if: github.head_ref == 'submission' || github.ref_name == 'submission'
    env:
      PROMPT_VERSION: improved
    run: uv run pytest tests/test_behavior_evals.py -v
